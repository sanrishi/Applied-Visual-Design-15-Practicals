<rect x="0" y="0" width="1440" height="960" fill="#F3EFE7"/><text x="80" y="48" font-family="IBM Plex Mono" font-weight="400" font-size="11" fill="#111A28" text-anchor="start" letter-spacing="1.4" opacity="0.55">APPLIED VISUAL DESIGN  /  2026</text><text x="1360" y="48" font-family="IBM Plex Mono" font-weight="400" font-size="11" fill="#111A28" text-anchor="end" letter-spacing="1.4" opacity="0.55">PRACTICAL 05  —  THREE LEVELS OF VISUAL HIERARCHY</text><line x1="80" y1="64" x2="1360" y2="64" stroke="#111A28" stroke-width="0.7" opacity="0.275"/><text x="80" y="300" font-family="Space Grotesk" font-weight="700" font-size="180" fill="#111A28" text-anchor="start" letter-spacing="-8">MAKE</text><text x="80" y="480" font-family="Space Grotesk" font-weight="700" font-size="180" fill="#F28C28" text-anchor="start" letter-spacing="-8">IT</text><text x="80" y="660" font-family="Space Grotesk" font-weight="700" font-size="180" fill="#111A28" text-anchor="start" letter-spacing="-8">CLEAR.</text><line x1="80" y1="700" x2="700" y2="700" stroke="#111A28" stroke-width="1" opacity="0.25"/><text x="80" y="740" font-family="Inter" font-weight="400" font-size="14" fill="#6B7280" text-anchor="start">A hierarchy is a promise to the reader.</text><text x="730" y="300" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F28C28" text-anchor="end" letter-spacing="1.2">01</text><text x="730" y="314" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="end" letter-spacing="1.2" opacity="0.7">PRIMARY</text><text x="730" y="480" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F28C28" text-anchor="end" letter-spacing="1.2">02</text><text x="730" y="494" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="end" letter-spacing="1.2" opacity="0.7">SECONDARY</text><text x="730" y="660" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F28C28" text-anchor="end" letter-spacing="1.2">03</text><text x="730" y="674" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="end" letter-spacing="1.2" opacity="0.7">TERTIARY</text><rect x="780" y="170" width="12" height="620" fill="#F28C28"/><rect x="820" y="170" width="540" height="620" fill="url(#p05panel)" rx="6"/><text x="870" y="220" font-family="IBM Plex Mono" font-weight="400" font-size="9" fill="#F2EEE5" text-anchor="start" letter-spacing="1.4" opacity="0.55">HIERARCHY / TYPE SPECIMEN</text><text x="870" y="390" font-family="Fraunces" font-weight="600" font-size="150" fill="#F2EEE5" text-anchor="start" letter-spacing="-4">Aa</text><text x="1080" y="320" font-family="IBM Plex Mono" font-weight="500" font-size="12" fill="#F28C28" text-anchor="start" letter-spacing="1.2">01</text><text x="1080" y="338" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#F2EEE5" text-anchor="start" letter-spacing="1.2">PRIMARY</text><text x="1080" y="356" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#F2EEE5" text-anchor="start" letter-spacing="1.0" opacity="0.5">150 PX / FRAUNCES</text><line x1="870" y1="420" x2="1310" y2="420" stroke="#F2EEE5" stroke-width="0.8" opacity="0.18"/><text x="870" y="505" font-family="Inter" font-weight="700" font-size="72" fill="#F28C28" text-anchor="start" letter-spacing="-1">Aa</text><text x="1080" y="485" font-family="IBM Plex Mono" font-weight="500" font-size="12" fill="#F28C28" text-anchor="start" letter-spacing="1.2">02</text><text x="1080" y="503" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#F2EEE5" text-anchor="start" letter-spacing="1.2">SECONDARY</text><text x="1080" y="521" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#F2EEE5" text-anchor="start" letter-spacing="1.0" opacity="0.5">72 PX / INTER BOLD</text><line x1="870" y1="550" x2="1310" y2="550" stroke="#F2EEE5" stroke-width="0.8" opacity="0.18"/><text x="870" y="620" font-family="IBM Plex Mono" font-weight="500" font-size="30" fill="#2A9D8F" text-anchor="start">Aa</text><text x="1080" y="600" font-family="IBM Plex Mono" font-weight="500" font-size="12" fill="#F28C28" text-anchor="start" letter-spacing="1.2">03</text><text x="1080" y="618" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#F2EEE5" text-anchor="start" letter-spacing="1.2">TERTIARY</text><text x="1080" y="636" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#F2EEE5" text-anchor="start" letter-spacing="1.0" opacity="0.5">28 PX / IBM PLEX MONO</text><text x="870" y="700" font-family="Inter" font-weight="400" font-size="11" fill="#F2EEE5" text-anchor="start" opacity="0.65">Size, weight, colour and position decide what</text><text x="870" y="718" font-family="Inter" font-weight="400" font-size="11" fill="#F2EEE5" text-anchor="start" opacity="0.65">the viewer notices first, second and last.</text><line x1="870" y1="750" x2="1310" y2="750" stroke="#F2EEE5" stroke-width="0.8" opacity="0.18"/><text x="870" y="775" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#F28C28" text-anchor="start" letter-spacing="0.8" opacity="0.85">CLEAR CONTRAST BETWEEN LEVELS KEEPS THE MESSAGE QUICK TO SCAN.</text><text x="80" y="840" font-family="IBM Plex Mono" font-weight="400" font-size="10" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.65">THE VIEWER READS IN ORDER  /  1  →  2  →  3</text><line x1="80" y1="902" x2="1360" y2="902" stroke="#111A28" stroke-width="0.7" opacity="0.2"/><text x="80" y="936" font-family="IBM Plex Mono" font-weight="400" font-size="10" fill="#111A28" text-anchor="start" letter-spacing="1.2" opacity="0.5">PRIMARY  ·  SECONDARY  ·  TERTIARY</text><text x="1360" y="936" font-family="IBM Plex Mono" font-weight="400" font-size="10" fill="#111A28" text-anchor="end" letter-spacing="1.2" opacity="0.5">05 / 15</text>
