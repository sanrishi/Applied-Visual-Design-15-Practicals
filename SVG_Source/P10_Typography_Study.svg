<rect x="0" y="0" width="1440" height="960" fill="#F6F2E9"/><text x="80" y="48" font-family="IBM Plex Mono" font-weight="400" font-size="11" fill="#111A28" text-anchor="start" letter-spacing="1.4" opacity="0.55">APPLIED VISUAL DESIGN  /  2026</text><text x="1360" y="48" font-family="IBM Plex Mono" font-weight="400" font-size="11" fill="#111A28" text-anchor="end" letter-spacing="1.4" opacity="0.55">PRACTICAL 10  —  TYPOGRAPHY STUDY</text><line x1="80" y1="64" x2="1360" y2="64" stroke="#111A28" stroke-width="0.7" opacity="0.275"/><text x="80" y="160" font-family="Space Grotesk" font-weight="700" font-size="74" fill="#111A28" text-anchor="start" letter-spacing="-4">TYPE STUDY</text><text x="80" y="200" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#F28C28" text-anchor="start" letter-spacing="1.4">SIX CLASSIFICATIONS  /  ONE ALPHABET</text><text x="900" y="150" font-family="Inter" font-weight="400" font-size="13" fill="#6B7280" text-anchor="start">A comparison of voice, rhythm and form.</text><text x="900" y="172" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start" opacity="0.8">Each classification carries a different personality.</text><rect x="80" y="260" width="410" height="300" fill="#FFF9EF" rx="3"/><rect x="80" y="260" width="410" height="8" fill="#F28C28" rx="3"/><rect x="80" y="260" width="410" height="300" fill="none" rx="3" stroke="#111A28" stroke-width="0.8" opacity="0.15"/><text x="468" y="298" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F28C28" text-anchor="end" letter-spacing="1.2" opacity="0.8">01</text><text x="104" y="416" font-family="Fraunces" font-weight="600" font-size="132" fill="#111A28" text-anchor="start" letter-spacing="-2">Aa</text><line x1="104" y1="442" x2="466" y2="442" stroke="#111A28" stroke-width="0.8" opacity="0.25"/><text x="104" y="472" font-family="IBM Plex Mono" font-weight="500" font-size="11" fill="#111A28" text-anchor="start" letter-spacing="1.4">SERIF</text><text x="104" y="496" font-family="Inter" font-weight="400" font-size="11" fill="#111A28" text-anchor="start" opacity="0.75">Traditional. Trustworthy. High stroke contrast.</text><text x="104" y="532" font-family="Fraunces" font-weight="600" font-size="18" fill="#111A28" text-anchor="start" opacity="0.95">Typography</text><text x="466" y="542" font-family="Fraunces" font-weight="600" font-size="80" fill="#111A28" text-anchor="end" opacity="0.06">Aa</text><rect x="510" y="260" width="410" height="300" fill="#142033" rx="3"/><rect x="510" y="260" width="410" height="8" fill="#F28C28" rx="3"/><rect x="510" y="260" width="410" height="300" fill="none" rx="3" stroke="#111A28" stroke-width="0.8" opacity="0.15"/><text x="898" y="298" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F28C28" text-anchor="end" letter-spacing="1.2" opacity="0.8">02</text><text x="534" y="416" font-family="Inter" font-weight="700" font-size="120" fill="#F2EEE5" text-anchor="start" letter-spacing="-2">Aa</text><line x1="534" y1="442" x2="896" y2="442" stroke="#F2EEE5" stroke-width="0.8" opacity="0.25"/><text x="534" y="472" font-family="IBM Plex Mono" font-weight="500" font-size="11" fill="#F2EEE5" text-anchor="start" letter-spacing="1.4">SANS-SERIF</text><text x="534" y="496" font-family="Inter" font-weight="400" font-size="11" fill="#F2EEE5" text-anchor="start" opacity="0.75">Neutral. Modern. Even stroke weight.</text><text x="534" y="532" font-family="Inter" font-weight="700" font-size="16" fill="#F2EEE5" text-anchor="start" opacity="0.95">Typography</text><text x="896" y="542" font-family="Inter" font-weight="700" font-size="80" fill="#F2EEE5" text-anchor="end" opacity="0.06">Aa</text><rect x="940" y="260" width="410" height="300" fill="#E9C46A" rx="3"/><rect x="940" y="260" width="410" height="8" fill="#142033" rx="3"/><rect x="940" y="260" width="410" height="300" fill="none" rx="3" stroke="#111A28" stroke-width="0.8" opacity="0.15"/><text x="1328" y="298" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#142033" text-anchor="end" letter-spacing="1.2" opacity="0.8">03</text><text x="964" y="416" font-family="Bitter" font-weight="700" font-size="120" fill="#111A28" text-anchor="start" letter-spacing="-2">Aa</text><line x1="964" y1="442" x2="1326" y2="442" stroke="#111A28" stroke-width="0.8" opacity="0.25"/><text x="964" y="472" font-family="IBM Plex Mono" font-weight="500" font-size="11" fill="#111A28" text-anchor="start" letter-spacing="1.4">SLAB SERIF</text><text x="964" y="496" font-family="Inter" font-weight="400" font-size="11" fill="#111A28" text-anchor="start" opacity="0.75">Sturdy. Confident. Block-like serifs.</text><text x="964" y="532" font-family="Bitter" font-weight="700" font-size="16" fill="#111A28" text-anchor="start" opacity="0.95">Typography</text><text x="1326" y="542" font-family="Bitter" font-weight="700" font-size="80" fill="#111A28" text-anchor="end" opacity="0.06">Aa</text><rect x="80" y="580" width="410" height="300" fill="#FFF9EF" rx="3"/><rect x="80" y="580" width="410" height="8" fill="#E76F51" rx="3"/><rect x="80" y="580" width="410" height="300" fill="none" rx="3" stroke="#111A28" stroke-width="0.8" opacity="0.15"/><text x="468" y="618" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#E76F51" text-anchor="end" letter-spacing="1.2" opacity="0.8">04</text><text x="104" y="736" font-family="Caveat" font-weight="700" font-size="150" fill="#111A28" text-anchor="start" letter-spacing="0">Aa</text><line x1="104" y1="762" x2="466" y2="762" stroke="#111A28" stroke-width="0.8" opacity="0.25"/><text x="104" y="792" font-family="IBM Plex Mono" font-weight="500" font-size="11" fill="#111A28" text-anchor="start" letter-spacing="1.4">SCRIPT</text><text x="104" y="816" font-family="Inter" font-weight="400" font-size="11" fill="#111A28" text-anchor="start" opacity="0.75">Flowing. Personal. Pen-like movement.</text><text x="104" y="852" font-family="Caveat" font-weight="700" font-size="24" fill="#111A28" text-anchor="start" opacity="0.95">Handwritten</text><text x="466" y="862" font-family="Caveat" font-weight="700" font-size="80" fill="#111A28" text-anchor="end" opacity="0.06">Aa</text><rect x="510" y="580" width="410" height="300" fill="#E76F51" rx="3"/><rect x="510" y="580" width="410" height="8" fill="#F2EEE5" rx="3"/><rect x="510" y="580" width="410" height="300" fill="none" rx="3" stroke="#111A28" stroke-width="0.8" opacity="0.15"/><text x="898" y="618" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F2EEE5" text-anchor="end" letter-spacing="1.2" opacity="0.8">05</text><text x="534" y="736" font-family="Archivo Black" font-weight="400" font-size="120" fill="#F2EEE5" text-anchor="start" letter-spacing="-2">Aa</text><line x1="534" y1="762" x2="896" y2="762" stroke="#F2EEE5" stroke-width="0.8" opacity="0.25"/><text x="534" y="792" font-family="IBM Plex Mono" font-weight="500" font-size="11" fill="#F2EEE5" text-anchor="start" letter-spacing="1.4">DISPLAY</text><text x="534" y="816" font-family="Inter" font-weight="400" font-size="11" fill="#F2EEE5" text-anchor="start" opacity="0.75">Loud. Heavy. Built for headlines.</text><text x="534" y="852" font-family="Archivo Black" font-weight="400" font-size="22" fill="#F2EEE5" text-anchor="start" opacity="0.95">HEADLINE</text><text x="896" y="862" font-family="Archivo Black" font-weight="400" font-size="80" fill="#F2EEE5" text-anchor="end" opacity="0.06">Aa</text><rect x="940" y="580" width="410" height="300" fill="#2A9D8F" rx="3"/><rect x="940" y="580" width="410" height="8" fill="#E9C46A" rx="3"/><rect x="940" y="580" width="410" height="300" fill="none" rx="3" stroke="#111A28" stroke-width="0.8" opacity="0.15"/><text x="1328" y="618" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#E9C46A" text-anchor="end" letter-spacing="1.2" opacity="0.8">06</text><text x="964" y="736" font-family="IBM Plex Mono" font-weight="500" font-size="110" fill="#F2EEE5" text-anchor="start" letter-spacing="-2">Aa</text><line x1="964" y1="762" x2="1326" y2="762" stroke="#F2EEE5" stroke-width="0.8" opacity="0.25"/><text x="964" y="792" font-family="IBM Plex Mono" font-weight="500" font-size="11" fill="#F2EEE5" text-anchor="start" letter-spacing="1.4">MONOSPACE</text><text x="964" y="816" font-family="Inter" font-weight="400" font-size="11" fill="#F2EEE5" text-anchor="start" opacity="0.75">Technical. Even. Every glyph same width.</text><text x="964" y="852" font-family="IBM Plex Mono" font-weight="500" font-size="11" fill="#F2EEE5" text-anchor="start" opacity="0.95">const code = 01;</text><text x="1326" y="862" font-family="IBM Plex Mono" font-weight="500" font-size="80" fill="#F2EEE5" text-anchor="end" opacity="0.06">Aa</text><text x="80" y="232" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#6B7280" text-anchor="start" letter-spacing="1.3" opacity="0.7">THE SAME TWO LETTERS, SIX DIFFERENT VOICES.</text><line x1="80" y1="902" x2="1360" y2="902" stroke="#111A28" stroke-width="0.7" opacity="0.2"/><text x="80" y="936" font-family="IBM Plex Mono" font-weight="400" font-size="10" fill="#111A28" text-anchor="start" letter-spacing="1.2" opacity="0.5">SERIF  ·  SANS  ·  SLAB  ·  SCRIPT  ·  DISPLAY  ·  MONO</text><text x="1360" y="936" font-family="IBM Plex Mono" font-weight="400" font-size="10" fill="#111A28" text-anchor="end" letter-spacing="1.2" opacity="0.5">10 / 15</text>
