>SLOW MORNINGS,</text><text x="80" y="466" font-family="Fraunces" font-weight="600" font-size="34" fill="#152238" text-anchor="start" letter-spacing="-0.6">GOOD THINGS</text><text x="80" y="500" font-family="Fraunces" font-weight="600" font-size="34" fill="#152238" text-anchor="start" letter-spacing="-0.6">FROM THE OVEN.</text><text x="970" y="450" font-family="Inter" font-weight="400" font-size="11" fill="#6E6A61" text-anchor="end">Seasonal produce, single-origin coffee</text><text x="970" y="470" font-family="Inter" font-weight="400" font-size="11" fill="#6E6A61" text-anchor="end">and pastry made in-house every morning.</text><line x1="80" y1="542" x2="970" y2="542" stroke="#152238" stroke-width="1" opacity="0.2"/><text x="80" y="590" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#EE7F2D" text-anchor="start" letter-spacing="1.5">01  /  ESPRESSO BAR</text><text x="80" y="632" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Espresso</text><text x="80" y="651" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">A bright, syrupy single origin.</text><line x1="530" y1="628" x2="888" y2="628" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="632" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">4.0</text><text x="80" y="690" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Cortado</text><text x="80" y="709" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Equal parts espresso and steamed milk.</text><line x1="530" y1="686" x2="888" y2="686" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="690" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">4.5</text><text x="80" y="748" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Flat White</text><text x="80" y="767" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Silky microfoam, two ristretto shots.</text><line x1="530" y1="744" x2="888" y2="744" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="748" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">5.0</text><text x="80" y="806" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Latte</text><text x="80" y="825" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Soft, sweet and generously sized.</text><line x1="530" y1="802" x2="888" y2="802" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="806" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">5.25</text><text x="80" y="864" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Mocha</text><text x="80" y="883" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Single-origin cocoa, espresso, steamed milk.</text><line x1="530" y1="860" x2="888" y2="860" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="864" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">5.75</text><text x="80" y="922" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Pour Over</text><text x="80" y="941" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Rotating lot, brewed to order.</text><line x1="530" y1="918" x2="888" y2="918" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="922" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">6.0</text><line x1="80" y1="1000" x2="970" y2="1000" stroke="#152238" stroke-width="1" opacity="0.2"/><text x="80" y="1044" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#EE7F2D" text-anchor="start" letter-spacing="1.5">02  /  FROM THE OVEN</text><text x="80" y="1086" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Butter Croissant</text><text x="80" y="1105" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Laminated over three days, baked at dawn.</text><line x1="530" y1="1082" x2="888" y2="1082" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="1086" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">4.5</text><text x="80" y="1140" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Almond Croissant</text><text x="80" y="1159" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Frangipane, toasted almonds, orange zest.</text><line x1="530" y1="1136" x2="888" y2="1136" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="1140" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">5.5</text><text x="80" y="1194" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Seasonal Scone</text><text x="80" y="1213" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Whatever the market gives us. Ask.</text><line x1="530" y1="1190" x2="888" y2="1190" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="1194" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">4.75</text><text x="80" y="1248" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Tomato Galette</text><text x="80" y="1267" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Heirloom tomato, ricotta, thyme.</text><line x1="530" y1="1244" x2="888" y2="1244" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="1248" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">8.5</text><text x="80" y="1302" font-family="Inter" font-weight="500" font-size="18" fill="#152238" text-anchor="start">Sourdough Toast</text><text x="80" y="1321" font-family="Inter" font-weight="400" font-size="9.4" fill="#6E6A61" text-anchor="start">Cultured butter, flaky salt, honey.</text><line x1="530" y1="1298" x2="888" y2="1298" stroke="#152238" stroke-width="1" opacity="0.22" stroke-dasharray="1 5" stroke-linecap="round"/><text x="970" y="1302" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#152238" text-anchor="end">7.0</text><rect x="80" y="1340" width="890" height="60" fill="#EE7F2D" rx="2"/><text x="104" y="1366" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#152238" text-anchor="start" letter-spacing="1.1">SEASONAL SPECIAL  /  HONEY LAVENDER LATTE</text><text x="104" y="1386" font-family="Inter" font-weight="400" font-size="10" fill="#152238" text-anchor="start" opacity="0.8">Local honey, organic lavender, oat milk. Available while the flowers last.</text><text x="946" y="1381" font-family="IBM Plex Mono" font-weight="500" font-size="18" fill="#152238" text-anchor="end">6.25</text><line x1="80" y1="1414" x2="970" y2="1414" stroke="#152238" stroke-width="1" opacity="0.2"/><text x="80" y="1442" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6E6A61" text-anchor="start" letter-spacing="0.8">214 ALDER STREET  /  PORTLAND, OR 97205</text><text x="970" y="1442" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6E6A61" text-anchor="end" letter-spacing="0.8">OPEN DAILY  /  07:00—18:00</text><text x="525" y="1442" font-family="IBM Plex Mono" font-weight="500" font-size="8" fill="#EE7F2D" text-anchor="middle" letter-spacing="1.0">BREWANDBLOOM.CO</text>
