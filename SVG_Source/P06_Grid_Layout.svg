one" stroke="#F2EEE5" stroke-width="1" opacity="0.12"/></g><text x="72.69291338582678" y="566" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#F2EEE5" text-anchor="start" letter-spacing="1.2" opacity="0.7">01 / IMAGE  —  6 COLUMNS</text><text x="725.3333333333333" y="298" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F28C28" text-anchor="start" letter-spacing="1.2">02</text><text x="725.3333333333333" y="332" font-family="Space Grotesk" font-weight="700" font-size="24" fill="#111A28" text-anchor="start" letter-spacing="-0.8">ALIGNMENT</text><line x1="725.3333333333333" y1="348" x2="1048.9868766404197" y2="348" stroke="#111A28" stroke-width="0.8" opacity="0.2"/><text x="725.3333333333333" y="376" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">A shared spine for every element. Text,</text><text x="725.3333333333333" y="394" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">image and space all begin at the same</text><text x="725.3333333333333" y="412" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">vertical line.</text><text x="725.3333333333333" y="550" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.55">SNAP TO COLUMN</text><text x="1059.6535433070867" y="298" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F28C28" text-anchor="start" letter-spacing="1.2">03</text><text x="1059.6535433070867" y="332" font-family="Space Grotesk" font-weight="700" font-size="24" fill="#111A28" text-anchor="start" letter-spacing="-0.8">SPACING</text><line x1="1059.6535433070867" y1="348" x2="1383.3070866141734" y2="348" stroke="#111A28" stroke-width="0.8" opacity="0.2"/><text x="1059.6535433070867" y="376" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">Consistent gutters create rhythm. The</text><text x="1059.6535433070867" y="394" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">eye reads structure before it reads</text><text x="1059.6535433070867" y="412" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">content.</text><text x="1059.6535433070867" y="550" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.55">SNAP TO COLUMN</text><rect x="56.69291338582678" y="650" width="435.0936132983377" height="150" fill="#EEE9DE" rx="3"/><rect x="56.69291338582678" y="650" width="435.0936132983377" height="8" fill="#F28C28"/><text x="74.69291338582678" y="700" font-family="Space Grotesk" font-weight="700" font-size="26" fill="#111A28" text-anchor="start" letter-spacing="-0.6">TYPE</text><text x="74.69291338582678" y="724" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">A system of scale.</text><text x="74.69291338582678" y="775" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.6">04 COLUMNS</text><line x1="391.78652668416447" y1="700" x2="447.78652668416447" y2="700" stroke="#F28C28" stroke-width="4"/><line x1="391.78652668416447" y1="716" x2="427.78652668416447" y2="716" stroke="#F28C28" stroke-width="4" opacity="0.7"/><line x1="391.78652668416447" y1="732" x2="459.78652668416447" y2="732" stroke="#F28C28" stroke-width="4" opacity="0.4"/><rect x="502.45319335083116" y="650" width="435.0936132983377" height="150" fill="#EEE9DE" rx="3"/><rect x="502.45319335083116" y="650" width="435.0936132983377" height="8" fill="#2A9D8F"/><text x="520.4531933508312" y="700" font-family="Space Grotesk" font-weight="700" font-size="26" fill="#111A28" text-anchor="start" letter-spacing="-0.6">IMAGE</text><text x="520.4531933508312" y="724" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">A window into the story.</text><text x="520.4531933508312" y="775" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.6">04 COLUMNS</text><rect x="837.5468066491688" y="696" width="72" height="50" fill="none" rx="2" stroke="#2A9D8F" stroke-width="1.5"/><circle cx="859.5468066491688" cy="714" r="7" fill="#2A9D8F" opacity="0.8"/><polygon points="841.5468066491688,744 869.5468066491688,720 893.5468066491688,744" fill="#2A9D8F" opacity="0.55"/><rect x="948.2134733158355" y="650" width="435.0936132983377" height="150" fill="#EEE9DE" rx="3"/><rect x="948.2134733158355" y="650" width="435.0936132983377" height="8" fill="#E9C46A"/><text x="966.2134733158355" y="700" font-family="Space Grotesk" font-weight="700" font-size="26" fill="#111A28" text-anchor="start" letter-spacing="-0.6">SPACE</text><text x="966.2134733158355" y="724" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">Room to breathe.</text><text x="966.2134733158355" y="775" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.6">04 COLUMNS</text><circle cx="1295.3070866141732" cy="722" r="6" fill="#E9C46A" opacity="0.8"/><circle cx="1317.3070866141732" cy="722" r="6" fill="#E9C46A" opacity="0.6200000000000001"/><circle cx="1339.3070866141732" cy="722" r="6" fill="#E9C46A" opacity="0.44000000000000006"/><text x="56.69291338582678" y="835" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#111A28" text-anchor="start" letter-spacing="1.2" opacity="0.65">THE GRID IS NOT A CAGE. IT IS A SHARED DECISION.</text><text x="1383.3070866141732" y="835" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#F28C28" text-anchor="end" letter-spacing="1.2">ALIGN  /  SPACE  /  RHYTHM</text><line x1="80" y1="902" x2="1360" y2="902" stroke="#111A28" stroke-width="0.7" opacity="0.2"/><text x="80" y="936" fo