iddle" letter-spacing="0.6" opacity="0.65">07</text><text x="882.4999999999999" y="252" font-family="IBM Plex Mono" font-weight="400" font-size="7" fill="#6B7280" text-anchor="middle" letter-spacing="0.6" opacity="0.65">08</text><text x="990.8333333333333" y="252" font-family="IBM Plex Mono" font-weight="400" font-size="7" fill="#6B7280" text-anchor="middle" letter-spacing="0.6" opacity="0.65">09</text><text x="1099.1666666666667" y="252" font-family="IBM Plex Mono" font-weight="400" font-size="7" fill="#6B7280" text-anchor="middle" letter-spacing="0.6" opacity="0.65">10</text><text x="1207.5" y="252" font-family="IBM Plex Mono" font-weight="400" font-size="7" fill="#6B7280" text-anchor="middle" letter-spacing="0.6" opacity="0.65">11</text><text x="1315.8333333333333" y="252" font-family="IBM Plex Mono" font-weight="400" font-size="7" fill="#6B7280" text-anchor="middle" letter-spacing="0.6" opacity="0.65">12</text><rect x="80" y="280" width="630" height="300" fill="url(#p06img)" rx="3"/><g clip-path="url(#p06clip)"><circle cx="410" cy="430" r="110" fill="url(#p06sun)"/><polygon points="80,580 250,380 390,540 500,420 710,580" fill="#2A9D8F" opacity="0.95"/><polygon points="80,580 210,470 330,580" fill="#1C6E66" opacity="0.95"/><rect x="80" y="540" width="630" height="40" fill="#E9C46A" opacity="0.35"/><path d="M 80 520 C 220 470 330 560 470 510 C 590 468 650 500 710 480" fill="none" stroke="#F2EEE5" stroke-width="2" opacity="0.35"/><rect x="80" y="280" width="630" height="300" fill="none" stroke="#F2EEE5" stroke-width="1" opacity="0.12"/></g><text x="96" y="566" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#F2EEE5" text-anchor="start" letter-spacing="1.2" opacity="0.7">01 / IMAGE  —  6 COLUMNS</text><text x="730.0" y="298" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F28C28" text-anchor="start" letter-spacing="1.2">02</text><text x="730.0" y="332" font-family="Space Grotesk" font-weight="700" font-size="24" fill="#111A28" text-anchor="start" letter-spacing="-0.8">ALIGNMENT</text><line x1="730.0" y1="348" x2="1035.0" y2="348" stroke="#111A28" stroke-width="0.8" opacity="0.2"/><text x="730.0" y="376" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">A shared spine for every element. Text,</text><text x="730.0" y="394" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">image and space all begin at the same</text><text x="730.0" y="412" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">vertical line.</text><text x="730.0" y="550" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.55">SNAP TO COLUMN</text><text x="1055.0" y="298" font-family="IBM Plex Mono" font-weight="500" font-size="9" fill="#F28C28" text-anchor="start" letter-spacing="1.2">03</text><text x="1055.0" y="332" font-family="Space Grotesk" font-weight="700" font-size="24" fill="#111A28" text-anchor="start" letter-spacing="-0.8">SPACING</text><line x1="1055.0" y1="348" x2="1360.0" y2="348" stroke="#111A28" stroke-width="0.8" opacity="0.2"/><text x="1055.0" y="376" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">Consistent gutters create rhythm. The</text><text x="1055.0" y="394" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">eye reads structure before it reads</text><text x="1055.0" y="412" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">content.</text><text x="1055.0" y="550" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.55">SNAP TO COLUMN</text><rect x="80.0" y="650" width="413.3333333333333" height="150" fill="#EEE9DE" rx="3"/><rect x="80.0" y="650" width="413.3333333333333" height="8" fill="#F28C28"/><text x="98.0" y="700" font-family="Space Grotesk" font-weight="700" font-size="26" fill="#111A28" text-anchor="start" letter-spacing="-0.6">TYPE</text><text x="98.0" y="724" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">A system of scale.</text><text x="98.0" y="775" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.6">04 COLUMNS</text><line x1="393.3333333333333" y1="700" x2="449.3333333333333" y2="700" stroke="#F28C28" stroke-width="4"/><line x1="393.3333333333333" y1="716" x2="429.3333333333333" y2="716" stroke="#F28C28" stroke-width="4" opacity="0.7"/><line x1="393.3333333333333" y1="732" x2="461.3333333333333" y2="732" stroke="#F28C28" stroke-width="4" opacity="0.4"/><rect x="513.3333333333333" y="650" width="413.3333333333333" height="150" fill="#EEE9DE" rx="3"/><rect x="513.3333333333333" y="650" width="413.3333333333333" height="8" fill="#2A9D8F"/><text x="531.3333333333333" y="700" font-family="Space Grotesk" font-weight="700" font-size="26" fill="#111A28" text-anchor="start" letter-spacing="-0.6">IMAGE</text><text x="531.3333333333333" y="724" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">A window into the story.</text><text x="531.3333333333333" y="775" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.6">04 COLUMNS</text><rect x="826.6666666666665" y="696" width="72" height="50" fill="none" rx="2" stroke="#2A9D8F" stroke-width="1.5"/><circle cx="848.6666666666665" cy="714" r="7" fill="#2A9D8F" opacity="0.8"/><polygon points="830.6666666666665,744 858.6666666666665,720 882.6666666666665,744" fill="#2A9D8F" opacity="0.55"/><rect x="946.6666666666666" y="650" width="413.3333333333333" height="150" fill="#EEE9DE" rx="3"/><rect x="946.6666666666666" y="650" width="413.3333333333333" height="8" fill="#E9C46A"/><text x="964.6666666666666" y="700" font-family="Space Grotesk" font-weight="700" font-size="26" fill="#111A28" text-anchor="start" letter-spacing="-0.6">SPACE</text><text x="964.6666666666666" y="724" font-family="Inter" font-weight="400" font-size="11" fill="#6B7280" text-anchor="start">Room to breathe.</text><text x="964.6666666666666" y="775" font-family="IBM Plex Mono" font-weight="400" font-size="8" fill="#6B7280" text-anchor="start" letter-spacing="1.2" opacity="0.6">04 COLUMNS</text><circle cx="1272.0" cy="722" r="6" fill="#E9C46A" opacity="0.8"/><circle cx="1294.0" cy="722" r="6" fill="#E9C46A" opacity="0.6200000000000001"/><circle cx="1316.0" cy="722" r="6" fill="#E9C46A" opacity="0.44000000000000006"/><text x="80" y="835" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#111A28" text-anchor="start" letter-spacing="1.2" opacity="0.65">THE GRID IS NOT A CAGE. IT IS A SHARED DECISION.</text><text x="1360" y="835" font-family="IBM Plex Mono" font-weight="500" font-size="10" fill="#F28C28" text-anchor="end" letter-spacing="1.2">ALIGN  /  SPACE  /  RHYTHM</text><line x1="80" y1="902" x2="1360" y2="902" stroke="#111A28" stroke-width="0.7" opacity="0.2"/><text x="80" y="936" font-family="IBM Plex Mono" font-weight="400" font-size="10" fill="#111A28" text-anchor="start" letter-spacing="1.2" opacity="0.5">ALIGNMENT  ·  SPACING  ·  STRUCTURE</text><text x="1360" y="936" font-family="IBM Plex Mono" font-weight="400" font-size="10" fill="#111A28" text-anchor="end" letter-spacing="1.2" opacity="0.5">06 / 15</text>
